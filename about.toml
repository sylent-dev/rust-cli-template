# The THIRD-PARTY-LICENSES file of a release: `cargo about generate --locked --fail about.hbs`,
# run by the Release workflow. Keep `accepted` the same as `allow` in deny.toml.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
targets = [
    "x86_64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
ignore-dev-dependencies = true
private = { ignore = true }

# A crate whose license file isn't the one cargo-about would pick is clarified here (see the
# `clarify` sections of cargo-about): a new version that changes the file then fails the
# generation, its checksum to update after reading it.
