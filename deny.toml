# The security advisories and the licenses of the dependencies of the application, on every
# system it is released for: `cargo deny check advisories licenses`, run by the Release workflow,
# and the advisories every day by the Advisories workflow. Each license listed here is one the
# application may ship under its own license (MIT OR Apache-2.0); check the list again when that
# license changes, and keep `accepted` of about.toml the same.

[graph]
targets = [
    "x86_64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
exclude-dev = true

[advisories]
# A version withdrawn by its authors is updated.
yanked = "deny"
# A crate unsound without `unsafe` fails the check wherever it is in the tree, not only among
# the direct dependencies (the default).
unsound = "all"
# The advisories that don't concern the application, each with its reason; remove an entry once
# its crate is gone from Cargo.lock.
ignore = []

[licenses]
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

# The crates of this workspace, never published: their license is the one of the project.
[licenses.private]
ignore = true
