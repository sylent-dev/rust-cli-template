<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mock-up</title>
<!--
  Starting point of the mock-up of a terminal interface or of a rich output (html-mockups skill).
  Replace the sample tool with the frames of the approved wireframe.

  - Each frame is a terminal: a grid of cells in a common monospace font (the application
    doesn't choose the font of the terminal), sized in columns and rows (`--cols`, `--rows`).
  - Each style only maps the roles of the interface (accent, weak text, results…) to the
    16 named colors of a terminal, under :root[data-theme="…"]; the components use the roles
    alone, so that a style is cheap to add or tweak. The named colors themselves belong to the
    user's terminal theme: the `terminal` tabs show a dark and a light one.
  - The `colors` tabs show every frame without colors (NO_COLOR): a meaning is never carried
    by color alone, so that each role keeps a symbol, a word or a style a terminal has (bold,
    dim, underline, reverse).
  - VARIANTS holds one group of tabs per open decision; the address keeps the choices
    (e.g. ?theme=calm&terminal=light), to share them. Remove a group once decided.
  - A value that combines with others (the borders, a set of symbols) is a list instead:
    `select: true`, with the CSS `variable` it sets, or `redraw: true` when the components read it.
  - A value tuned by eye (the width of the terminal) is a slider: `range` and the CSS `variable`
    it sets, with its `unit` if it has one.
  - sections() lists every scenario and state, each drawn as a terminal; a new section goes at
    the top, so that the owner finds it at once. Past ten sections, a table of contents under
    the header links to each.

  Serve the repository root without cache, on the port of the project (docs/technical-choices.md),
  so that the page reaches assets/ even in a sandboxed browser (mockup-screenshots skill):
    python3 docs/mockups/serve.py <port>
  then open http://127.0.0.1:<port>/docs/mockups/<this file>.html
-->
<style>
  /* The page around the terminals: neutral, so that it doesn't compete with the styles. */
  body { margin: 0; background: #2a2d31; color: #e9ecef; font: 14px/1.4 system-ui, sans-serif; }
  .page-tabs { position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; gap: 6px 18px; padding: 10px 16px; background: #1b1d20; border-bottom: 1px solid #3a3f45; }
  .page-tabs .group { display: flex; align-items: center; gap: 4px; }
  .page-tabs .group > span { margin-right: 4px; color: #adb5bd; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
  .page-tabs button { padding: 4px 10px; border: 1px solid #3a3f45; border-radius: 4px; background: #24272b; color: #dee2e6; font: inherit; cursor: pointer; }
  .page-tabs button[aria-pressed="true"] { background: #e9ecef; color: #1b1d20; border-color: #e9ecef; }
  .page-tabs input[type="range"] { width: 140px; accent-color: #e9ecef; }
  .page-tabs output { min-width: 3ch; color: #dee2e6; font-variant-numeric: tabular-nums; }
  .page-tabs select { padding: 3px 4px; border: 1px solid #3a3f45; border-radius: 4px; background: #24272b; color: #dee2e6; font: inherit; cursor: pointer; }
  .page-header { padding: 18px 16px 0; }
  .page-header h1 { margin: 0 0 4px; font-size: 20px; }
  .page-header p { margin: 0; max-width: 760px; color: #adb5bd; }
  .page-section { padding: 8px 16px 24px; scroll-margin-top: 60px; }   /* stops under the tabs */
  .page-contents { margin-top: 12px; display: grid; grid-template-columns: repeat(4, max-content); gap: 4px 28px; font-size: 13px; }
  .page-contents a { color: #adb5bd; text-decoration: none; }
  .page-contents a:hover { color: #fff; text-decoration: underline; }
  .page-section h2 { font-size: 15px; color: #adb5bd; font-weight: 600; }
  .page-row { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; }
  .page-slot > span { display: block; margin-bottom: 6px; color: #adb5bd; font-size: 12px; }
  .page-warning { margin: 0; padding: 10px 16px; background: #8a6a10; color: #fff; }

  /* The terminal theme of the user: the named colors, which the application never sets. */
  :root[data-terminal="dark"] {
    --term-bg: #1e1f22; --term-fg: #d4d4d4;
    --red: #e06c75; --green: #98c379; --yellow: #e5c07b; --blue: #61afef; --magenta: #c678dd; --cyan: #56b6c2;
    --bright-black: #7f848e;
  }
  :root[data-terminal="light"] {
    --term-bg: #fafafa; --term-fg: #383a42;
    --red: #c8352d; --green: #3f8f2f; --yellow: #a77b00; --blue: #2f6fd6; --magenta: #9a3fb4; --cyan: #1d8a96;
    --bright-black: #8a8d94;
  }

  /* Styles: the roles mapped to the named colors, nothing else. */
  :root[data-theme="calm"] { --accent: var(--blue); --weak: var(--bright-black); --good: var(--green); --bad: var(--red); }
  :root[data-theme="warm"] { --accent: var(--yellow); --weak: var(--bright-black); --good: var(--cyan); --bad: var(--magenta); }
  /* Without colors (NO_COLOR): every role falls back to the text color, and keeps its style. */
  :root[data-colors="none"] { --accent: var(--term-fg); --weak: var(--term-fg); --good: var(--term-fg); --bad: var(--term-fg); }

  /* Components: prefix the classes of the application (here `app-`) and of the states
     (`is-`), so that they never collide with the classes of the page or of each other.
     Only the styles a terminal supports: bold, dim, underline, reverse (italic isn't everywhere). */
  .app-terminal {
    box-sizing: content-box; width: calc(var(--cols, 80) * 1ch); height: calc(var(--rows, 24) * 1.25em); overflow: hidden;
    padding: 6px 8px; background: var(--term-bg); color: var(--term-fg);
    font: 14px/1.25 ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace; white-space: pre;
    box-shadow: 0 8px 30px #0006;
  }
  .app-accent { color: var(--accent); font-weight: 700; }
  .app-weak { color: var(--weak); }
  :root[data-colors="none"] .app-weak { opacity: .7; }   /* dim */
  .app-good { color: var(--good); }
  .app-bad { color: var(--bad); font-weight: 700; }
  .app-key { text-decoration: underline; }
  /* A symbol takes one cell, as in a terminal, even when the browser draws it with a wider font. */
  .app-symbol { display: inline-block; width: 1ch; text-align: center; vertical-align: bottom; }
  .app-key .app-symbol { text-decoration: underline; }   /* an inline block doesn't inherit it */
  .is-selected { background: var(--term-fg); color: var(--term-bg); }   /* reverse */
</style>
</head>
<body>
<p class="page-warning" id="file-warning" hidden>Opened as a file: serve the repository root (see the comment at the top of this page) so that the files of assets/ load.</p>
<nav class="page-tabs" id="tabs" aria-label="Styles and variants"></nav>
<main id="sheet"></main>
<script>
  const THEMES = {
    calm: { title: "A · Calm", text: "Blue for the accent, green and red for the results, gray for the weak text." },
    warm: { title: "B · Warm", text: "Yellow for the accent, cyan and magenta for the results, told apart without red and green." },
  };
  // Box-drawing sets, the ASCII one for a terminal that can't show the others.
  const BORDERS = {
    light: { h: "─", v: "│", tl: "┌", tr: "┐", bl: "└", br: "┘" },
    rounded: { h: "─", v: "│", tl: "╭", tr: "╮", bl: "╰", br: "╯" },
    ascii: { h: "-", v: "|", tl: "+", tr: "+", bl: "+", br: "+" },
  };
  // One group of tabs per open decision; `fallback` is the choice shown by default.
  const VARIANTS = {
    theme: { label: "Style", options: Object.fromEntries(Object.entries(THEMES).map(([key, theme]) => [key, theme.title])), fallback: "calm" },
    terminal: { label: "Terminal", options: { dark: "Dark", light: "Light" }, fallback: "dark" },
    colors: { label: "Colors", options: { on: "On", none: "NO_COLOR" }, fallback: "on" },
    // A list, for a value that combines with others; `redraw`, since the components read it.
    borders: { label: "Borders", select: true, redraw: true, options: { rounded: "Rounded", light: "Light", ascii: "ASCII" }, fallback: "rounded" },
    // A slider, for a value tuned by eye: `unit` follows the value in the CSS variable.
    cols: { label: "Columns", range: { min: 60, max: 120, step: 1 }, variable: "--cols", unit: "", fallback: "80" },
  };

  const params = new URLSearchParams(location.search);
  const accepts = (variant, value) => variant.range
    ? value !== null && Number(value) >= variant.range.min && Number(value) <= variant.range.max
    : value in variant.options;
  const chosen = Object.fromEntries(Object.entries(VARIANTS).map(([key, variant]) =>
    [key, accepts(variant, params.get(key)) ? params.get(key) : variant.fallback]));

  // Components: functions that return the lines of a terminal, with sample data close to real ones.
  // Avoid global names that the browser already uses (`top`, `name`, `status`…).
  // A meaning never rests on color alone: a symbol or a word goes with it (✓ ✗, "error:").
  // A line is [plain text, html]: the plain text counts the cells, the html styles them.
  const span = (role, text) => `<span class="app-${role}">${text}</span>`;
  const symbol = text => [...text].map(character => `<span class="app-symbol">${character}</span>`).join("");
  const pad = (text, width) => text + " ".repeat(Math.max(0, width - [...text].length));
  const box = (title, lines, width = 50) => {
    const b = BORDERS[chosen.borders];
    return [
      b.tl + b.h + " " + span("accent", title) + " " + b.h.repeat(Math.max(0, width - title.length - 3)) + b.tr,
      ...lines.map(([plain, html]) => b.v + " " + html + " ".repeat(Math.max(0, width - 1 - [...plain].length)) + b.v),
      b.bl + b.h.repeat(width) + b.br,
    ].join("\n");
  };
  const repository = ([path, size, clean], selected) => {
    const plain = pad(path, 30) + pad(size, 10) + (clean ? "✓ clean" : "✗ dirty");
    const html = pad(path, 30) + span("weak", pad(size, 10)) + (clean ? span("good", symbol("✓") + " clean") : span("bad", symbol("✗") + " dirty"));
    const selectedHtml = pad(path, 30) + pad(size, 10) + symbol(clean ? "✓" : "✗") + (clean ? " clean" : " dirty");
    return [plain, selected ? `<span class="is-selected">${selectedHtml}</span>` : html];
  };
  const keys = () => `${span("key", "q")} quit  ${span("key", symbol("↑↓"))} move  ${span("key", "/")} search`;
  const terminal = (...lines) => `<div class="app-terminal">${lines.join("\n")}</div>`;

  const REPOSITORIES = [["~/projects/exile-market", "1.2 GB", true], ["~/projects/old-prototype", "312 MB", false], ["~/projects/stepwise", "88 MB", true]];
  const EMPTY = "Nothing found under ~/projects.";

  // Every scenario and state: [section title, [[label, html], …]], the newest section first.
  // Built at each render, since the components read the choices (the borders).
  const sections = () => [
    ["Main screen", [
      ["With data", terminal(box("Repositories", REPOSITORIES.map(r => repository(r, false))), "", keys())],
      ["Row selected", terminal(box("Repositories", REPOSITORIES.map((r, index) => repository(r, index === 1))), "", keys())],
    ]],
    ["States", [
      ["Empty", terminal(box("Repositories", [[EMPTY, span("weak", EMPTY)]]), "", keys())],
      ["Error", terminal(span("bad", "error:") + " can't read ~/projects: permission denied", span("weak", "hint: run it again on a folder you can read"))],
    ]],
  ];

  // A list or a slider that only changes a variable leaves the page as it is, and a slider keeps the pointer.
  function applyVariables() {
    for (const [key, variant] of Object.entries(VARIANTS)) {
      if (variant.variable) document.documentElement.style.setProperty(variant.variable, chosen[key] + (variant.unit ?? ""));
    }
  }
  const keepInAddress = () => history.replaceState(null, "", "?" + new URLSearchParams(chosen));

  function render() {
    for (const key of Object.keys(VARIANTS)) document.documentElement.dataset[key] = chosen[key];
    applyVariables();
    document.getElementById("tabs").innerHTML = Object.entries(VARIANTS).map(([key, variant]) => variant.range
      ? `<label class="group"><span>${variant.label}</span><input type="range" data-variant="${key}" min="${variant.range.min}" max="${variant.range.max}" step="${variant.range.step}" value="${chosen[key]}"><output>${chosen[key]}${variant.unit ?? ""}</output></label>`
      : variant.select
      ? `<label class="group"><span>${variant.label}</span><select data-variant="${key}">${Object.entries(variant.options).map(([value, label]) =>
        `<option value="${value}" ${chosen[key] === value ? "selected" : ""}>${label}</option>`).join("")}</select></label>`
      : `<div class="group"><span>${variant.label}</span>${Object.entries(variant.options).map(([value, label]) =>
        `<button type="button" data-variant="${key}" data-value="${value}" aria-pressed="${chosen[key] === value}">${label}</button>`).join("")}</div>`).join("");
    const theme = THEMES[chosen.theme];
    const all = sections();
    // Past ten sections, a table of contents under the header: the title of each section up to its colon.
    const contents = all.length > 10
      ? `<nav class="page-contents" aria-label="Sections">${all.map(([title], index) =>
        `<a href="#section-${index + 1}">${title.split(":")[0]}</a>`).join("")}</nav>`
      : "";
    document.getElementById("sheet").innerHTML = `
      <header class="page-header"><h1>Style ${theme.title}</h1><p>${theme.text} Sample data.</p>${contents}</header>
      ${all.map(([title, slots], index) => `<section class="page-section" id="section-${index + 1}"><h2>${title}</h2><div class="page-row">${
        slots.map(([label, html]) => `<div class="page-slot"><span>${label}</span>${html}</div>`).join("")}</div></section>`).join("")}`;
  }

  document.getElementById("tabs").addEventListener("click", event => {
    const { variant, value } = event.target.dataset;
    if (!variant || value === undefined) return;
    chosen[variant] = value;
    keepInAddress();
    render();
  });
  // A list fires "input" too; so does a slider, at every step of its move.
  document.getElementById("tabs").addEventListener("input", event => {
    const { variant } = event.target.dataset;
    if (!variant) return;
    chosen[variant] = event.target.value;
    if (VARIANTS[variant].range) event.target.nextElementSibling.value = chosen[variant] + (VARIANTS[variant].unit ?? "");
    keepInAddress();
    if (VARIANTS[variant].redraw) render(); else applyVariables();
  });
  document.getElementById("file-warning").hidden = location.protocol !== "file:";
  render();
</script>
</body>
</html>
